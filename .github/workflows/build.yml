name: Build APK dari ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buka file zip
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Membuka $ZIP"
          unzip -o "$ZIP" -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bangun APK
        run: cd "$PROJ" && gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RemoteTV-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Remote TV v0.1.${{ github.run_number }}
          files: ${{ env.PROJ }}/app/build/outputs/apk/release/app-release.apk

